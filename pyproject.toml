[project]
name = "imat-researcher"
version = "0.1.0"
description = "Multi-agent deep research: plan searches, run them, write a report, deliver it."
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.14.0",
    "openai-agents>=0.15.1",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
]

[project.scripts]
imat-researcher = "imat_researcher.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imat_researcher"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
